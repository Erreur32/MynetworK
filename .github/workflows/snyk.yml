name: Snyk Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# The Snyk CLI is installed directly (snyk/actions/setup) instead of the
# Docker-based snyk/actions/node|docker actions: those pull snyk/snyk images
# from Docker Hub, whose anonymous per-IP rate limit regularly fails CI.
permissions: {}

jobs:
  snyk-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Snyk CLI
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # master

      - name: Run Snyk Open Source (dependencies)
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --severity-threshold=high --sarif-file-output=snyk-deps.sarif

      - name: Upload Snyk dependency results to GitHub
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('snyk-deps.sarif') != ''
        with:
          sarif_file: snyk-deps.sarif

  snyk-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image for scanning
        run: docker build -t mynetwork:scan .

      - name: Install Snyk CLI
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # master

      - name: Run Snyk Container (Docker image)
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk container test mynetwork:scan --file=Dockerfile --severity-threshold=high --sarif-file-output=snyk-docker.sarif

      - name: Upload Snyk Docker results to GitHub
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('snyk-docker.sarif') != ''
        with:
          sarif_file: snyk-docker.sarif
